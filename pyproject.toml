[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circle-detection"
version = "0.2.0"
description = "Detect circles against noise using a small CNN"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Antony Paulson" }]
keywords = ["cnn", "circle-detection", "computer-vision", "tensorflow"]
dependencies = [
    "numpy>=1.24",
    "tensorflow>=2.16,<2.20",
    "shapely>=2.0",
    "scikit-image>=0.22",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
gui = ["opencv-python>=4.8"]

[project.scripts]
circle-detection = "circle_detection.__main__:main"

[project.urls]
Homepage = "https://github.com/antonypaulson/circle_detection"

[tool.setuptools.packages.find]
include = ["circle_detection*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
